services:
  - type: web
    name: agricbylovely-api
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: SCHEDULED_EMAILS_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
